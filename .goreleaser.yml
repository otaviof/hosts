---
version: 2

project_name: hosts
dist: ./bin/dist

builds:
  - id: hosts
    binary: hosts
    main: cmd/hosts/main.go
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats:
      - tar.gz
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'

release:
  draft: false
  prerelease: auto
